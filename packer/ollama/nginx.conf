server {
    listen 11434;

    location / {
        proxy_pass http://127.0.0.1:11435;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_max_body_size 0;
    }
}

server {
    listen 127.0.0.1:8080;

    location = /stub_status {
        stub_status;
    }
}
