name: "Terraform CD (Apply & Destroy)"

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Choose the action Terraform should perform"
        required: true
        default: "apply"
        type: choice
        options:
          - apply
          - destroy

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-cd
  cancel-in-progress: false

jobs:
  cd:
    name: "Terraform ${{ inputs.action }}"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TF_VAR_admin_cidr: ${{ vars.ADMIN_CIDR }}
      TF_VAR_ssh_public_key: ${{ vars.SSH_PUBLIC_KEY }}
      TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
      TF_VAR_slack_webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
      TF_VAR_domain_name: ${{ vars.DOMAIN_NAME }}
      TF_VAR_route53_delegation_set_id: ${{ vars.ROUTE53_DELEGATION_SET_ID }}
      TF_VAR_vpn_cidrs: ${{ vars.VPN_CIDRS }}
      TF_VAR_github_client_id: ${{ vars.OAUTH_GITHUB_CLIENT_ID }}
      TF_VAR_github_client_secret: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
      TF_VAR_gitlab_client_id: ${{ vars.OAUTH_GITLAB_CLIENT_ID }}
      TF_VAR_gitlab_client_secret: ${{ secrets.OAUTH_GITLAB_CLIENT_SECRET }}
      ACTION: ${{ inputs.action }}

    defaults:
      run:
        working-directory: ./terraform

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.17.1"
          terraform_wrapper: false

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-north-1

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Apply
        if: env.ACTION == 'apply'
        run: terraform apply -auto-approve -input=false

      - name: Read monitoring outputs
        run: |
          echo "GRAFANA_URL=$(terraform output -raw grafana_url 2>/dev/null || true)" >> "$GITHUB_ENV"
          echo "MONITORING_SG_ID=$(terraform output -raw monitoring_security_group_id 2>/dev/null || true)" >> "$GITHUB_ENV"
          echo "KEYCLOAK_URL=$(terraform output -raw keycloak_url 2>/dev/null || true)" >> "$GITHUB_ENV"
          echo "WEB_ALB_SG_ID=$(terraform output -raw web_alb_security_group_id 2>/dev/null || true)" >> "$GITHUB_ENV"
          echo "RUNNER_CIDR=$(curl -fsS https://checkip.amazonaws.com)/32" >> "$GITHUB_ENV"

      - name: Allow runner to reach Grafana
        if: env.MONITORING_SG_ID != ''
        run: aws ec2 authorize-security-group-ingress --group-id "$MONITORING_SG_ID" --protocol tcp --port 3000 --cidr "$RUNNER_CIDR"

      - name: Wait for Grafana
        if: env.MONITORING_SG_ID != ''
        run: curl -fsS --retry 30 --retry-delay 10 --retry-all-errors "$GRAFANA_URL/api/health"

      - name: Grafana ${{ inputs.action }}
        if: env.MONITORING_SG_ID != ''
        working-directory: ./terraform/grafana
        run: |
          terraform init -input=false
          terraform "$ACTION" -auto-approve -input=false

      - name: Revoke runner access to Grafana
        if: always() && env.MONITORING_SG_ID != ''
        run: aws ec2 revoke-security-group-ingress --group-id "$MONITORING_SG_ID" --protocol tcp --port 3000 --cidr "$RUNNER_CIDR" || true

      - name: Allow runner to reach Keycloak
        if: env.WEB_ALB_SG_ID != ''
        run: aws ec2 authorize-security-group-ingress --group-id "$WEB_ALB_SG_ID" --protocol tcp --port 443 --cidr "$RUNNER_CIDR"

      - name: Wait for Keycloak
        if: env.WEB_ALB_SG_ID != ''
        run: curl -fsS --retry 60 --retry-delay 10 --retry-all-errors "$KEYCLOAK_URL/realms/master" > /dev/null

      - name: Keycloak ${{ inputs.action }}
        if: env.WEB_ALB_SG_ID != ''
        working-directory: ./terraform/keycloak
        run: |
          terraform init -input=false
          terraform "$ACTION" -auto-approve -input=false

      - name: Revoke runner access to Keycloak
        if: always() && env.WEB_ALB_SG_ID != ''
        run: aws ec2 revoke-security-group-ingress --group-id "$WEB_ALB_SG_ID" --protocol tcp --port 443 --cidr "$RUNNER_CIDR" || true

      - name: Terraform Destroy
        if: env.ACTION == 'destroy'
        run: terraform destroy -auto-approve -input=false
